<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Cave Manager"/>

<title>Cave Manager 🍷</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --c1:#1a1a2e;--c2:#16213e;--c3:#0f3460;
  --acc:#e94560;--gold:#f5a623;
  --ok:#27ae60;--warn:#e67e22;
  --text:#f0f0f0;--muted:#94a3b8;
  --card:#1e2a45;--border:#2a3f5f;--radius:10px
}
html,body{height:100%;max-height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--c1);color:var(--text);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;height:100%;background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 100%);overflow-y:auto}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:340px;max-width:94vw;text-align:center}
.login-logo{font-size:3.2rem;margin-bottom:0.4rem}
.login-title{font-size:1.4rem;font-weight:700;margin-bottom:0.2rem}
.login-sub{font-size:0.85rem;color:var(--muted);margin-bottom:1.6rem}
.lang-btns{display:flex;gap:6px;justify-content:center;margin-bottom:1.4rem}
.lang-btn{background:#0f1929;border:1px solid var(--border);color:var(--muted);padding:5px 16px;border-radius:20px;font-size:0.82rem;cursor:pointer;transition:all .2s}
.lang-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.login-box input{width:100%;background:#0f1929;border:1px solid var(--border);color:var(--text);padding:0.8rem 1rem;border-radius:var(--radius);font-size:1rem;margin-bottom:0.9rem;outline:none;-webkit-appearance:none}
.login-box input:focus{border-color:var(--acc)}
.btn-login{width:100%;background:var(--acc);color:#fff;border:none;padding:0.9rem;border-radius:var(--radius);font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s;letter-spacing:.5px}
.btn-login:active{opacity:.8}
.login-err{color:var(--acc);font-size:0.85rem;margin-top:0.8rem;min-height:1.2em}

/* ── HEADER ── */
#main-app{display:none;flex-direction:column;height:100%;overflow:hidden}
.top-bar{background:var(--c2);border-bottom:1px solid var(--border);padding:0.7rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.top-left{display:flex;align-items:center;gap:8px}
.app-logo{font-size:1.4rem}
.app-name{font-size:1rem;font-weight:700}
.role-badge{font-size:0.68rem;background:var(--c3);color:var(--gold);border-radius:20px;padding:2px 9px;font-weight:600}
.top-right{display:flex;align-items:center;gap:6px}
.alert-badge{background:var(--acc);color:#fff;border-radius:20px;padding:2px 10px;font-size:0.72rem;font-weight:700;display:none}
.lang-btn-sm{background:#0f1929;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:20px;font-size:0.75rem;cursor:pointer;transition:all .2s}
.lang-btn-sm.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:20px;font-size:0.78rem;cursor:pointer}
.btn-logout:active{background:var(--border)}

/* ── TABS ── */
.nav-tabs{display:flex;background:var(--c2);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-tab{padding:0.8rem 1.1rem;font-size:0.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;user-select:none}
.nav-tab.active{color:var(--text);border-bottom-color:var(--acc);font-weight:600}

/* ── CONTENT ── */
.content{padding:1rem;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ── SUMMARY ── */
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.2rem}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:0.6rem 0.4rem;text-align:center}
.sum-val{font-size:1.4rem;font-weight:700;line-height:1.2}
.sum-lbl{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:1rem}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.7rem 1rem 0.7rem 2.4rem;border-radius:var(--radius);font-size:0.95rem;outline:none;-webkit-appearance:none}
.search-wrap input:focus{border-color:var(--acc)}
.search-ico{position:absolute;left:0.8rem;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}

/* ── SECTION ── */
.sec-title{font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:1.2rem 0 0.7rem;display:flex;align-items:center;gap:6px}
.sec-title:first-child{margin-top:0}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:0.5rem}

/* ── ITEM CARD ── */
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:0.85rem;transition:border-color .2s}
.item-card.st-alert{border-color:var(--acc);background:#1e1520}
.item-card.st-warn{border-color:var(--warn);background:#1e1a10}
.item-name{font-size:0.88rem;font-weight:600;margin-bottom:0.15rem;line-height:1.3}
.item-note{font-size:0.68rem;color:var(--muted);font-weight:400}
.item-qty{font-size:1.5rem;font-weight:700;margin:0.3rem 0;line-height:1}
.item-qty.ok{color:var(--ok)}
.item-qty.warn{color:var(--warn)}
.item-qty.alert{color:var(--acc)}
.item-min{font-size:0.68rem;color:var(--muted);margin-bottom:0.6rem;line-height:1.4}
.item-ctrl{display:flex;align-items:center;gap:6px}
.cb{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:#0f1929;color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:background .15s;flex-shrink:0;-webkit-appearance:none}
.cb:active{transform:scale(.93)}
.cb.minus:active{background:#3d1520}
.cb.plus:active{background:#153d20}
.qty-inp{flex:1;min-width:0;text-align:center;background:#0f1929;border:1px solid var(--border);color:var(--text);padding:5px 2px;border-radius:6px;font-size:0.88rem;-webkit-appearance:none;outline:none}
.view-qty{font-size:0.8rem;color:var(--muted)}

/* ── ORDERS ── */
.order-section{margin-bottom:1.5rem}
.order-hdr{display:flex;align-items:center;gap:8px;margin-bottom:0.7rem;flex-wrap:wrap}
.order-lbl{font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.order-cnt{background:var(--acc);color:#fff;border-radius:20px;padding:2px 10px;font-size:0.75rem;font-weight:700}
.order-cnt.done{background:var(--ok)}
.order-list{display:flex;flex-direction:column;gap:8px}
.order-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:0.85rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.order-item.done-item{border-color:var(--ok);opacity:.65}
.order-name{font-weight:600;font-size:0.9rem}
.order-det{font-size:0.73rem;color:var(--muted);margin-top:3px;line-height:1.4}
.ord-btn{padding:6px 14px;border-radius:20px;font-size:0.76rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;white-space:nowrap;-webkit-appearance:none}
.ord-btn.need{background:#3d1520;color:var(--acc);border:1px solid var(--acc)}
.ord-btn.done{background:#153d20;color:var(--ok);border:1px solid var(--ok)}
.ord-btn:active{transform:scale(.96)}
.empty-order{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:0.9rem}

@media(max-width:380px){
  .items-grid{grid-template-columns:1fr 1fr}
  .summary-bar{gap:5px}
  .sum-val{font-size:1.2rem}

</style>
</head>

    </div>

</div>

const SECS = ['jus','sirop','alcool','biere','bar','the','bar2'];

/* ──────────────────────────────
   STATE  (localStorage)
────────────────────────────── */
let STOCK = {};
let lang = 'pt';
let currentUser = null, currentRole = null;

function saveStock(){
  try{ localStorage.setItem('cave_stock', JSON.stringify(STOCK)); }catch(e){}
}
function loadStock(){
  try{
    const saved = localStorage.getItem('cave_stock');
    if(saved){
      const parsed = JSON.parse(saved);
      // merge saved qty/ordered into initial structure (keeps new products)
      SECS.forEach(sec=>{
        STOCK[sec] = INITIAL[sec].map(item=>{
          const sv = (parsed[sec]||[]).find(x=>x.id===item.id);
          return sv ? {...item, qty: sv.qty, ordered: sv.ordered||false} : {...item, ordered: false};
        });
      });
    } else {
      SECS.forEach(sec=>{ STOCK[sec] = INITIAL[sec].map(i=>({...i, ordered:false})); });
    }
  }catch(e){
    SECS.forEach(sec=>{ STOCK[sec] = INITIAL[sec].map(i=>({...i, ordered:false})); });
  }
}

function saveLang(){ try{ localStorage.setItem('cave_lang', lang); }catch(e){} }
function loadLang(){ try{ return localStorage.getItem('cave_lang')||'pt'; }catch(e){ return 'pt'; } }

────────────────────────────── */
function t(k){ return TX[lang][k]||k; }

function status(item){
  if(item.qty === 0) return 'alert';
  if(item.qty < item.min) return 'alert';
  if(item.qty <= item.min) return 'warn';
  return 'ok';
}

function findItem(id){
  for(const s of SECS){ const i = STOCK[s].find(x=>x.id===id); if(i) return i; }
  return null;
}

function setLang(l){
  lang = l; saveLang();
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.textContent.includes(l==='pt'?'🇧🇷':'🇫🇷')));
  document.getElementById('lbpt').classList.toggle('active', l==='pt');
  document.getElementById('lbfr').classList.toggle('active', l==='fr');
  document.getElementById('lt').textContent = t('loginTitle');
  document.getElementById('ls').textContent = t('loginSub');
  document.getElementById('btn-entrar').textContent = t('entrar');
  if(currentUser) renderAll();
}

/* ──────────────────────────────
   AUTH
────────────────────────────── */
function doLogin(){
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  if(USERS[u] && USERS[u].pass === p){
    currentUser = u; currentRole = USERS[u].role;
    try{ localStorage.setItem('cave_session', JSON.stringify({u, r: currentRole})); }catch(e){}
    showApp();
  } else {
    const el = document.getElementById('lerr');
    el.textContent = t('loginErr');
    setTimeout(()=>el.textContent='', 3000);
  }
}
document.getElementById('lp').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('lu').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lp').focus(); });

function doLogout(){
  currentUser = null; currentRole = null;
  try{ localStorage.removeItem('cave_session'); }catch(e){}
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('lu').value = '';
  document.getElementById('lp').value = '';
}

function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'flex';
  renderAll();
}

// Auto-login from saved session
function tryAutoLogin(){
  try{
    const s = localStorage.getItem('cave_session');
    if(s){
      const {u, r} = JSON.parse(s);
      if(USERS[u] && USERS[u].role === r){ currentUser=u; currentRole=r; showApp(); return; }
    }
  }catch(e){}
  document.getElementById('login-screen').style.display = 'flex';
}

/* ──────────────────────────────
   TABS
────────────────────────────── */
function switchTab(tab){
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===tab));
  document.getElementById('pstock').style.display  = tab==='stock'  ? 'block' : 'none';
  document.getElementById('porders').style.display = tab==='orders' ? 'block' : 'none';
  if(tab==='orders') renderOrders();
}

/* ──────────────────────────────
   STOCK
────────────────────────────── */
function changeQty(id, delta){
  const item = findItem(id); if(!item) return;
  item.qty = Math.max(0, item.qty + delta);
  saveStock(); renderStock(); renderOrders();
}
function setQty(id, val){
  const item = findItem(id); if(!item) return;
  item.qty = Math.max(0, parseInt(val)||0);
  saveStock(); renderStock(); renderOrders();
}

function renderStock(){
  const q = (document.getElementById('sinput')||{}).value || '';
  const filter = q.toLowerCase();
  const isAdmin = currentRole === 'admin';
  const secNames = {jus:t('jus'),sirop:t('sirop'),alcool:t('alcool'),biere:t('biere'),bar:t('bar'),the:t('the'),bar2:t('bar2')};

  let html = '';
  let totAlert=0, totLow=0, totOk=0;

  SECS.forEach(sec=>{
    const items = STOCK[sec].filter(i=>!filter||i.name.toLowerCase().includes(filter));

    // update counters for all items (not just filtered)
    STOCK[sec].forEach(i=>{
      const st = status(i);
      if(st==='alert') totAlert++;
      else if(st==='warn') totLow++;
      else totOk++;
    });

    if(!items.length) return;
    html += `<div class="sec-title">${secNames[sec]}</div><div class="items-grid">`;

    items.forEach(item=>{
      const st = status(item);
      const u = item.unit || t('un');
      let minTxt = `${t('min')}: ${item.min} ${u}`;
      if(item.box) minTxt += ` · ${t('cx')} ${item.box}${item.extra?` +${item.extra}`:''}`;

      html += `<div class="item-card st-${st==='ok'?'ok':st}">
        <div class="item-name">${item.name}${item.note?` <span class="item-note">(${item.note})</span>`:''}</div>
        <div class="item-qty ${st}">${item.qty} <span style="font-size:.8rem">${u}</span></div>
        <div class="item-min">${minTxt}</div>
        ${isAdmin
          ? `<div class="item-ctrl">
              <button class="cb minus" onclick="changeQty('${item.id}',-1)">−</button>
              <input class="qty-inp" type="number" inputmode="numeric" min="0" value="${item.qty}" onchange="setQty('${item.id}',this.value)"/>
              <button class="cb plus" onclick="changeQty('${item.id}',1)">+</button>
             </div>`
          : `<div class="view-qty">${t('atual')}: ${item.qty}</div>`}
      </div>`;
    });
    html += '</div>';
  });

  if(!html && filter) html = `<div style="text-align:center;padding:2rem;color:var(--muted)">Nenhum produto encontrado</div>`;

  // reset counters (we counted all even if filter active)
  let a2=0,l2=0,o2=0;
  SECS.forEach(sec=>STOCK[sec].forEach(i=>{const s=status(i);if(s==='alert')a2++;else if(s==='warn')l2++;else o2++;}));

  document.getElementById('sv-total').textContent = SECS.reduce((n,s)=>n+STOCK[s].length,0);
  document.getElementById('sv-alert').textContent = a2;
  document.getElementById('sv-low').textContent   = l2;
  document.getElementById('sv-ok').textContent    = o2;
  document.getElementById('sl-total').textContent = t('total');
  document.getElementById('sl-alert').textContent = t('alerta');
  document.getElementById('sl-low').textContent   = t('baixo');
  document.getElementById('sl-ok').textContent    = t('ok');
  document.getElementById('tab-stock').textContent = t('tabStock');
  document.getElementById('tab-orders').textContent = t('tabOrders');

  const cnt = a2 + l2;
  const ab = document.getElementById('abadge');
  ab.textContent = cnt + '⚠'; ab.style.display = cnt > 0 ? '' : 'none';

  document.getElementById('stock-body').innerHTML = html;
}

/* ──────────────────────────────
   ORDERS
────────────────────────────── */
function toggleOrdered(id){
  const item = findItem(id); if(!item) return;
  item.ordered = !item.ordered;
  saveStock(); renderOrders();
}

function renderOrders(){
  const all = SECS.flatMap(s=>STOCK[s]);
  const toOrder = all.filter(i => status(i) !== 'ok' || i.ordered);
  const pending = toOrder.filter(i => !i.ordered);
  const done    = toOrder.filter(i =>  i.ordered);
  const isAdmin = currentRole === 'admin';

  let html = `<div class="sec-title">${t('encTit')}</div>`;

  if(!pending.length && !done.length){
    html += `<div class="empty-order">${t('semEnc')}</div>`;
  } else {
    if(pending.length){
      html += `<div class="order-section">
        <div class="order-hdr">
          <span class="order-lbl">${t('pendente')}</span>
          <span class="order-cnt">${pending.length}</span>
        </div>
        <div class="order-list">`;
      pending.forEach(item=>{
        const sec = SECS.find(s=>STOCK[s].find(x=>x.id===item.id));
        const sn = {jus:t('jus'),sirop:t('sirop'),alcool:t('alcool'),biere:t('biere'),bar:t('bar'),the:t('the'),bar2:t('bar2')}[sec]||sec;
        const u = item.unit||t('un');
        const need = Math.max(0, item.min - item.qty);
        html += `<div class="order-item">
          <div style="flex:1;min-width:0">
            <div class="order-name">${item.name}${item.note?` <span class="item-note">(${item.note})</span>`:''}</div>
            <div class="order-det">${sn} · ${t('atual')}: ${item.qty} ${u} · ${t('min')}: ${item.min} ${u} · ${t('falta')}: ~${need} ${u}${item.box?` · ${t('cx')} ${item.box}`:''}</div>
          </div>
          ${isAdmin?`<button class="ord-btn need" onclick="toggleOrdered('${item.id}')">${t('btnNeed')}</button>`:''}
        </div>`;
      });
      html += '</div></div>';
    }
    if(done.length){
      html += `<div class="order-section">
        <div class="order-hdr">
          <span class="order-lbl" style="color:var(--ok)">${t('encomendados')}</span>
          <span class="order-cnt done">${done.length}</span>
        </div>
        <div class="order-list">`;
      done.forEach(item=>{
        const u = item.unit||t('un');
        html += `<div class="order-item done-item">
          <div style="flex:1;min-width:0">
            <div class="order-name">✓ ${item.name}</div>
            <div class="order-det">${t('min')}: ${item.min} ${u} · ${t('atual')}: ${item.qty} ${u}</div>
          </div>
          ${isAdmin?`<button class="ord-btn done" onclick="toggleOrdered('${item.id}')">${t('btnDone')}</button>`:''}
        </div>`;
      });
      html += '</div></div>';
    }
  }
  document.getElementById('orders-body').innerHTML = html;
}

function renderAll(){
  document.getElementById('rbadge').textContent = currentRole==='admin' ? t('admin') : t('viewer');
  document.getElementById('btn-sair').textContent = t('sair');
  document.getElementById('lbpt').classList.toggle('active', lang==='pt');
  document.getElementById('lbfr').classList.toggle('active', lang==='fr');
  document.getElementById('sinput').placeholder = t('buscar');
  renderStock();
  renderOrders();
}

/* ──────────────────────────────
   INIT
────────────────────────────── */
lang = loadLang();
setLang(lang); // update login labels
loadStock();
tryAutoLogin();
</script>
</body>
</html>
